[preset.0]
name="Linux Desktop"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.scn.gz,*.xml,*.mo,licenses/*.txt"
exclude_filter="native/*,tests/*,world/authoring/*"
export_path="../build/godot-linux/LinCity-NG.x86_64"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false

[preset.1]
name="macOS Apple Silicon"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.scn.gz,*.xml,*.mo,licenses/*.txt"
exclude_filter="native/*,tests/*,world/authoring/*"
export_path="../build/godot-macos/LinCity-NG.app"
script_export_mode=2

[preset.1.options]
export/distribution_type=0
binary_format/architecture="arm64"
application/bundle_identifier="io.github.lincity-ng.lincity-ng"
application/min_macos_version_arm64="15.0"
codesign/codesign=1
notarization/notarization=0

[preset.2]
name="Windows x64"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.scn.gz,*.xml,*.mo,licenses/*.txt"
exclude_filter="native/*,tests/*,world/authoring/*"
export_path="../build/godot-windows/LinCity-NG.exe"
script_export_mode=2

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=2
application/modify_resources=false
codesign/enable=false
